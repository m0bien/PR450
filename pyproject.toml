[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr450"
version = "0.1.0"
description = "Passive radar simulation framework for 450 MHz LTE (B72) and 5G NR (n72) illuminators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]
# Independent NR cross-check (AGPL-3.0): keep as a test-only dependency, never ship it
xcheck = ["py3gpp>=0.6"]

[tool.setuptools.packages.find]
include = ["pr450*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
